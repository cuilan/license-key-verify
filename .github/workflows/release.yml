name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release (e.g. v2.0.0); must be an existing tag'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: 创建发布
    runs-on: ubuntu-latest
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 设置 Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: 缓存 Go 模块
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.mod') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: 下载依赖
      run: make deps

    - name: 运行测试
      run: make test

    - name: 创建发布包
      run: make release

    - name: Generate release notes
      run: |
        set -e
        TAG="${{ inputs.tag_name || github.ref_name }}"
        # Find the previous tag (excluding the one being released)
        PREVIOUS_TAG=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -n 1 || true)

        # Write to a temp file -- never overwrite the repo's CHANGELOG.md
        NOTES="/tmp/release_notes.md"
        if [ -n "$PREVIOUS_TAG" ]; then
          echo "## Changes" > "$NOTES"
          echo "" >> "$NOTES"
          git log --pretty=format:"- %s (%h)" "${PREVIOUS_TAG}..${TAG}" >> "$NOTES"
        else
          echo "First release of ${TAG}" > "$NOTES"
        fi
        echo "Release notes written to $NOTES"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ inputs.tag_name || github.ref_name }}
        name: Release ${{ inputs.tag_name || github.ref_name }}
        body_path: /tmp/release_notes.md
        files: |
          dist/release/*.zip
        draft: false
        prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 上传发布产物
      uses: actions/upload-artifact@v4
      with:
        name: release-packages
        path: dist/release/
        retention-days: 90 